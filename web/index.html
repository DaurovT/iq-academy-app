<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Подставляется значением --base-href при сборке (сейчас /beta/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover — под «чёлку» iPhone, запрет зума — чтобы веб-версия
       вела себя как приложение, а не как сайт -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="IQ Academy — обучение, квесты и вознаграждения для фармацевтов и врачей">
  <meta name="theme-color" content="#0D1117">

  <!-- iOS: установка на домашний экран -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IQ Academy">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IQ Academy</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; background: #0D1117; }
    /* Заставка на время загрузки движка: без неё пользователь несколько секунд
       смотрит в пустой чёрный экран. Снимается по первому кадру Flutter. */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 24px;
      background: #0D1117; transition: opacity .25s ease;
    }
    #boot img { width: 96px; height: 96px; border-radius: 22px; }
    #boot .bar {
      width: 140px; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,.12); overflow: hidden;
    }
    #boot .bar i {
      display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #7C5CFF; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="IQ Academy">
    <div class="bar"><i></i></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
